services:
  - type: web
    name: portal-karri
    runtime: docker
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: WA_AUTH_DIR
        value: /data/.wwebjs_auth
      - key: DATA_DIR
        value: /data
      - key: PORT
        value: 3000
      # Las siguientes variables se configuran manualmente en el dashboard de Render:
      # GOOGLE_SHEET_ID, GOOGLE_SHEET_GID, GOOGLE_CREDENTIALS_B64
      # PANEL_USER, PANEL_PASSWORD, SESSION_SECRET
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
