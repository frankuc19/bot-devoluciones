<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Karri — Capacitación</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  #lms-frame { width:100%; height:100%; border:none; display:block; }
</style>
</head>
<body>
<div class="flex h-screen overflow-hidden">
  <aside id="sidebar" style="background:#080b0a;border-right:1px solid rgba(255,255,255,0.08);width:220px;flex-shrink:0;display:flex;flex-direction:column;height:100%;"></aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header style="background:#080b0a;border-bottom:1px solid rgba(255,255,255,0.08);" class="h-14 flex items-center justify-between px-5 flex-shrink:0">
      <div class="flex items-center gap-3">
        <span style="color:#78fcd6;"><i data-lucide="graduation-cap" class="w-4 h-4"></i></span>
        <h1 style="font-size:15px;font-weight:600;color:#e7eceb;">Capacitación de Conductores</h1>
      </div>
      <div class="flex items-center gap-2">
        <span style="font-size:11px;color:rgba(231,236,235,.4);">LMS · LocalStorage + Google Sheets</span>
      </div>
    </header>

    <div class="flex-1 overflow-hidden">
      <iframe id="lms-frame" src="/capacitacion/lms.html?mode=panel" title="LMS Capacitación"></iframe>
    </div>
  </div>
</div>

<script src="/sidebar.js"></script>
<script>
initSidebar('cap-lms').then(() => lucide.createIcons());
</script>
</body>
</html>
