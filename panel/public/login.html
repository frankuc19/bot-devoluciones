<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karri — Iniciar sesión</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:#ffffff;
    font-family: Inter, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 25% 15%, rgba(5,150,105,0.08) 0%, transparent 55%),
      radial-gradient(ellipse at 75% 85%, rgba(5,150,105,0.05) 0%, transparent 50%);
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 1;
    background:#ffffff;
    border: 1px solid rgba(15,23,22,0.08);
    border-radius: 24px;
    padding: 40px 36px 36px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.55);
  }

  /* Logo */
  .logo-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }

  .logo-wrap img, .logo-wrap canvas {
    height: 100px;
    width: auto;
    display: block;
  }

  /* Heading */
  .heading {
    text-align: center;
    margin-bottom: 32px;
  }

  .heading h1 {
    font-size: 26px;
    font-weight: 800;
    color:#12181a;
    letter-spacing: -0.03em;
    margin-bottom: 6px;
  }

  .heading p {
    font-size: 13px;
    color: rgba(15,23,22,0.45);
  }

  /* Form */
  .form-group {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color:#12181a;
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background:#f4f5f6;
    border: 1px solid rgba(15,23,22,0.08);
    color:#12181a;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    font-family: Inter, sans-serif;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input::placeholder { color: rgba(15,23,22,0.25); }

  input:focus {
    border-color:#059669;
    box-shadow: 0 0 0 3px rgba(5,150,105,0.1);
  }

  /* Error */
  .error {
    background: rgba(220,38,38,0.08);
    border: 1px solid rgba(220,38,38,0.2);
    color:#dc2626;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 12px;
    margin-bottom: 16px;
    display: none;
  }
  .error.show { display: block; }

  /* Submit */
  button[type="submit"] {
    width: 100%;
    background: #78fcd6;
    color: #080b0a;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    font-family: Inter, sans-serif;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s, box-shadow 0.15s;
    letter-spacing: -0.01em;
  }

  button[type="submit"]:hover {
    background: #00ffb6;
    box-shadow: 0 0 24px rgba(5,150,105,0.3);
  }
</style>
</head>
<body>
<div class="card">

  <div class="logo-wrap">
    <canvas id="logo-canvas"></canvas>
  </div>

  <div class="heading">
    <h1>Bienvenido</h1>
    <p>Inicia sesión en tu cuenta para continuar</p>
  </div>

  <div class="error" id="err">Usuario o contraseña incorrectos</div>

  <form method="POST" action="/login">
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" name="user" autocomplete="username" autofocus placeholder="Ingresa tu usuario">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" name="password" autocomplete="current-password" placeholder="Ingresa tu contraseña">
    </div>
    <button type="submit">Iniciar Sesión</button>
  </form>

</div>
<script>
  if (new URLSearchParams(location.search).get('error'))
    document.getElementById('err').classList.add('show');

  (async () => {
    const canvas = document.getElementById('logo-canvas');
    const img = new Image();
    img.onerror = () => {
      canvas.style.display = 'none';
      const fb = document.createElement('img');
      fb.src = 'https://res.cloudinary.com/dkkab5dea/image/upload/v1780809949/Karri_2.1_ng9gss.png';
      fb.alt = 'Karri';
      canvas.parentElement.appendChild(fb);
    };
    img.onload = () => {
      const tmp = document.createElement('canvas');
      tmp.width  = img.naturalWidth;
      tmp.height = img.naturalHeight;
      const tCtx = tmp.getContext('2d');
      tCtx.drawImage(img, 0, 0);
      const id = tCtx.getImageData(0, 0, tmp.width, tmp.height);
      const d = id.data;

      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i+1], b = d[i+2];
        const brightness = (r + g + b) / 3;
        const saturation = Math.max(r, g, b) - Math.min(r, g, b);
        if (brightness > 200 && saturation < 60) {
          d[i+3] = 0;
        } else if (brightness > 160 && saturation < 40) {
          d[i+3] = Math.round(d[i+3] * (1 - (brightness - 160) / 40));
        }
      }
      tCtx.putImageData(id, 0, 0);

      let minX = tmp.width, minY = tmp.height, maxX = 0, maxY = 0;
      for (let y = 0; y < tmp.height; y++) {
        for (let x = 0; x < tmp.width; x++) {
          if (d[(y * tmp.width + x) * 4 + 3] > 30) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      const w = maxX - minX + 1;
      const h = maxY - minY + 1;
      canvas.width  = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(tmp, minX, minY, w, h, 0, 0, w, h);
    };
    img.src = '/api/logo-proxy';
  })();
</script>
</body>
</html>
