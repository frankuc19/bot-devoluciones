<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso — Bot Devoluciones</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1117; color: #e2e8f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #1a1d27; border: 1px solid #2a2d3e;
    border-radius: 14px; padding: 36px 32px; width: 340px;
  }
  h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
  .sub { font-size: .78rem; color: #64748b; margin-bottom: 28px; }
  label { display: block; font-size: .78rem; color: #94a3b8; margin-bottom: 6px; }
  input {
    width: 100%; background: #0f1117; border: 1px solid #2a2d3e;
    color: #e2e8f0; border-radius: 8px; padding: 10px 12px;
    font-size: .88rem; outline: none; margin-bottom: 16px;
  }
  input:focus { border-color: #00d4aa; }
  button {
    width: 100%; background: #00d4aa; color: #000;
    border: none; border-radius: 8px; padding: 11px;
    font-size: .9rem; font-weight: 700; cursor: pointer; margin-top: 4px;
  }
  button:hover { opacity: .88; }
  .error {
    background: #2d1a1a; border: 1px solid #7f1d1d;
    color: #fca5a5; border-radius: 8px; padding: 10px 12px;
    font-size: .8rem; margin-bottom: 16px; display: none;
  }
  .error.show { display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>Bot Devoluciones</h1>
  <div class="sub">Falabella — Panel de control</div>
  <div class="error" id="err">Usuario o contrasena incorrectos</div>
  <form method="POST" action="/login">
    <label>Usuario</label>
    <input type="text" name="user" autocomplete="username" autofocus>
    <label>Contrasena</label>
    <input type="password" name="password" autocomplete="current-password">
    <button type="submit">Ingresar</button>
  </form>
</div>
<script>
  if (new URLSearchParams(location.search).get('error'))
    document.getElementById('err').classList.add('show');
</script>
</body>
</html>
