<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karri — Iniciar sesión</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f1211;
    font-family: Inter, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 25% 15%, rgba(120,252,214,0.08) 0%, transparent 55%),
      radial-gradient(ellipse at 75% 85%, rgba(120,252,214,0.05) 0%, transparent 50%);
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 1;
    background: #181c1b;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 40px 36px 36px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.55);
  }

  /* Logo */
  .logo-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }

  .logo-wrap img {
    height: 72px;
    width: auto;
    object-fit: contain;
  }

  /* Heading */
  .heading {
    text-align: center;
    margin-bottom: 32px;
  }

  .heading h1 {
    font-size: 26px;
    font-weight: 800;
    color: #e7eceb;
    letter-spacing: -0.03em;
    margin-bottom: 6px;
  }

  .heading p {
    font-size: 13px;
    color: rgba(231,236,235,0.45);
  }

  /* Form */
  .form-group {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #e7eceb;
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background: #27272a;
    border: 1px solid rgba(255,255,255,0.08);
    color: #e7eceb;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    font-family: Inter, sans-serif;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input::placeholder { color: rgba(231,236,235,0.25); }

  input:focus {
    border-color: #78fcd6;
    box-shadow: 0 0 0 3px rgba(120,252,214,0.1);
  }

  /* Error */
  .error {
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.2);
    color: #fca5a5;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 12px;
    margin-bottom: 16px;
    display: none;
  }
  .error.show { display: block; }

  /* Submit */
  button[type="submit"] {
    width: 100%;
    background: #78fcd6;
    color: #080b0a;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    font-family: Inter, sans-serif;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s, box-shadow 0.15s;
    letter-spacing: -0.01em;
  }

  button[type="submit"]:hover {
    background: #00ffb6;
    box-shadow: 0 0 24px rgba(120,252,214,0.3);
  }
</style>
</head>
<body>
<div class="card">

  <div class="logo-wrap">
    <img src="https://res.cloudinary.com/dkkab5dea/image/upload/v1780803640/karri-logo_kmgmzm.png" alt="Karri">
  </div>

  <div class="heading">
    <h1>Bienvenido</h1>
    <p>Inicia sesión en tu cuenta para continuar</p>
  </div>

  <div class="error" id="err">Usuario o contraseña incorrectos</div>

  <form method="POST" action="/login">
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" name="user" autocomplete="username" autofocus placeholder="Ingresa tu usuario">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" name="password" autocomplete="current-password" placeholder="Ingresa tu contraseña">
    </div>
    <button type="submit">Iniciar Sesión</button>
  </form>

</div>
<script>
  if (new URLSearchParams(location.search).get('error'))
    document.getElementById('err').classList.add('show');
</script>
</body>
</html>
