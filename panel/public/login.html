<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karri — Iniciar sesión</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f1211;
    font-family: Inter, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 25% 15%, rgba(120,252,214,0.08) 0%, transparent 55%),
      radial-gradient(ellipse at 75% 85%, rgba(120,252,214,0.05) 0%, transparent 50%);
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 1;
    background: #181c1b;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 40px 36px 36px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.55);
  }

  /* Logo */
  .logo-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }

  .logo-wrap img {
    max-height: 130px;
    max-width: 260px;
    height: auto;
    width: auto;
    display: block;
  }

  /* Heading */
  .heading {
    text-align: center;
    margin-bottom: 32px;
  }

  .heading h1 {
    font-size: 26px;
    font-weight: 800;
    color: #e7eceb;
    letter-spacing: -0.03em;
    margin-bottom: 6px;
  }

  .heading p {
    font-size: 13px;
    color: rgba(231,236,235,0.45);
  }

  /* Form */
  .form-group {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #e7eceb;
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background: #27272a;
    border: 1px solid rgba(255,255,255,0.08);
    color: #e7eceb;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    font-family: Inter, sans-serif;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input::placeholder { color: rgba(231,236,235,0.25); }

  input:focus {
    border-color: #78fcd6;
    box-shadow: 0 0 0 3px rgba(120,252,214,0.1);
  }

  /* Error */
  .error {
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.2);
    color: #fca5a5;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 12px;
    margin-bottom: 16px;
    display: none;
  }
  .error.show { display: block; }

  /* Submit */
  button[type="submit"] {
    width: 100%;
    background: #78fcd6;
    color: #080b0a;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    font-family: Inter, sans-serif;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s, box-shadow 0.15s;
    letter-spacing: -0.01em;
  }

  button[type="submit"]:hover {
    background: #00ffb6;
    box-shadow: 0 0 24px rgba(120,252,214,0.3);
  }
</style>
</head>
<body>
<div class="card">

  <div class="logo-wrap">
    <img id="logoImg" alt="Karri" style="opacity:0;transition:opacity .3s;max-height:130px;max-width:260px;height:auto;width:auto;display:block;">
  </div>

  <div class="heading">
    <h1>Bienvenido</h1>
    <p>Inicia sesión en tu cuenta para continuar</p>
  </div>

  <div class="error" id="err">Usuario o contraseña incorrectos</div>

  <form method="POST" action="/login">
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" name="user" autocomplete="username" autofocus placeholder="Ingresa tu usuario">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" name="password" autocomplete="current-password" placeholder="Ingresa tu contraseña">
    </div>
    <button type="submit">Iniciar Sesión</button>
  </form>

</div>
<script>
  if (new URLSearchParams(location.search).get('error'))
    document.getElementById('err').classList.add('show');

  // Canvas: fetch como blob (evita CORS taint) → elimina fondo blanco → bounding box trim
  (function () {
    const SRC = 'https://res.cloudinary.com/dkkab5dea/image/upload/v1780803640/karri-logo_kmgmzm.png';
    const el  = document.getElementById('logoImg');

    function fallback() { el.src = SRC; el.style.opacity = '1'; }

    function process(blobUrl) {
      const img = new Image();
      img.onerror = fallback;
      img.onload = function () {
        try {
          const W = img.naturalWidth * 3;
          const H = img.naturalHeight * 3;

          const c = document.createElement('canvas');
          c.width = W; c.height = H;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, W, H);

          const id = ctx.getImageData(0, 0, W, H);
          const px = id.data;

          // BFS desde todo el borde para eliminar fondo blanco conectado
          const visited = new Uint8Array(W * H);
          const q = [];

          function white(x, y) {
            const i = (y * W + x) * 4;
            return px[i] > 245 && px[i+1] > 245 && px[i+2] > 245 && px[i+3] > 0;
          }
          function seed(x, y) {
            const i = y * W + x;
            if (!visited[i] && white(x, y)) { visited[i] = 1; q.push(x, y); }
          }

          for (let x = 0; x < W; x++) { seed(x, 0); seed(x, H-1); }
          for (let y = 1; y < H-1; y++) { seed(0, y); seed(W-1, y); }

          while (q.length) {
            const x = q.shift(), y = q.shift();
            px[(y * W + x) * 4 + 3] = 0;
            if (x > 0)   seed(x-1, y);
            if (x < W-1) seed(x+1, y);
            if (y > 0)   seed(x, y-1);
            if (y < H-1) seed(x, y+1);
          }

          ctx.putImageData(id, 0, 0);

          // Bounding box del contenido visible
          let x0=W, x1=0, y0=H, y1=0;
          for (let y = 0; y < H; y++)
            for (let x = 0; x < W; x++)
              if (px[(y*W+x)*4+3] > 0) {
                if (x<x0) x0=x; if (x>x1) x1=x;
                if (y<y0) y0=y; if (y>y1) y1=y;
              }

          if (x0 > x1 || y0 > y1) { fallback(); return; }

          const out = document.createElement('canvas');
          out.width = x1-x0+1; out.height = y1-y0+1;
          out.getContext('2d').drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);

          el.src = out.toDataURL('image/png');
          el.style.opacity = '1';
        } catch (e) {
          console.error('Canvas logo error:', e);
          fallback();
        }
      };
      img.src = blobUrl;
    }

    fetch(SRC, { mode: 'cors' })
      .then(r => r.blob())
      .then(blob => process(URL.createObjectURL(blob)))
      .catch(fallback);
  })();
</script>
</body>
</html>
